server.port=${PORT:8080}
spring.application.name=dead-internet-lens
spring.threads.virtual.enabled=true
server.error.include-message=never

# FalkorDB (docker compose up -d), published on host port 6380 by compose.yaml
lens.falkor.host=${FALKOR_HOST:localhost}
lens.falkor.port=${FALKOR_PORT:6380}
lens.falkor.username=${FALKOR_USERNAME:}
lens.falkor.password=${FALKOR_PASSWORD:}

# Reply-to-reply similarity graph
lens.similarity.edge-threshold=0.72
lens.similarity.max-edges-per-reply=6

# coordinationScore = 0.55 * textSimilarity + 0.30 * timingProximity + 0.15 * sharedPatternScore
lens.coordination.threshold=0.75
lens.coordination.text-weight=0.55
lens.coordination.timing-weight=0.30
lens.coordination.pattern-weight=0.15
lens.coordination.timing-window-seconds=120
lens.coordination.min-cluster-size=3

# 0.00-0.39 human_like / 0.40-0.64 uncertain / 0.65-1.00 automation_like
lens.thresholds.human=0.40
lens.thresholds.automation=0.65

# JEV classifier. provider: auto | http | heuristic
# auto = HTTP JEV when JEV_URL is set, otherwise the clearly labeled local heuristic.
# If JEV fails for an account, that account is marked uncertain (classificationSource=HEURISTIC_FALLBACK).
lens.jev.provider=${JEV_PROVIDER:auto}
lens.jev.url=${JEV_URL:}
lens.jev.token=${JEV_TOKEN:}
lens.jev.timeout-seconds=8
lens.jev.parallelism=8

# Analyze the bundled demo at startup so the page opens on a finished graph.
lens.demo.analyze-on-startup=true

# Live capture: the server drives a real browser window. Off on hosted deployments (CAPTURE_ENABLED=false).
lens.capture.enabled=${CAPTURE_ENABLED:true}
# Live capture: the server drives a real browser window to scroll an X / LinkedIn thread.
# The profile is separate from your everyday Chrome; log in there once and it is remembered.
lens.capture.profile-dir=${LENS_BROWSER_PROFILE:${user.home}/.dead-internet-lens/browser-profile}
lens.capture.channel=chrome
lens.capture.headless=false
lens.capture.max-replies=400
lens.capture.max-minutes=6
# Development only: also accept http://localhost pages (the extension test-harness fixtures).
lens.capture.allow-local-pages=false
# Plain Chrome used for the sign-in window (sites refuse sign-in from automated browsers).
lens.capture.chrome-path=${LENS_CHROME_PATH:/Applications/Google Chrome.app/Contents/MacOS/Google Chrome}

# Imported analyses kept in FalkorDB; the oldest are deleted beyond this (the demo is never counted).
lens.max-stored-analyses=${MAX_STORED_ANALYSES:30}
